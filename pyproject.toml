[project]
name = "docmind"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "docling>=2.107.0",
    "easyocr>=1.7.2",
    "fastapi>=0.139.2",
    "httpx>=0.28.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.4.0",
    "langgraph-checkpoint-postgres>=2.0",
    "langsmith>=0.10.9",
    "pandas>=3.0.3",
    "pdfplumber>=0.11.10",
    "pgvector>=0.3",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.2",
    "pwdlib[argon2]>=0.3.0",
    "pydantic>=2.13.4",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "torch>=2.12.1",
    "torchvision>=0.27.1",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

# --- PyTorch wheels per platform ---------------------------------------------
# Windows dev machine: CUDA 12.6 build (runs on the local NVIDIA GPU).
# Linux (CI, Docker, the CPU-only ARM server): CPU build, so no multi-GB CUDA
# libraries are installed where there is no GPU. Recorded in uv.lock.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'win32'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'win32'" },
]

[tool.pytest.ini_options]
# Put the project root on sys.path so tests can `import src...` cleanly.
pythonpath = ["."]
testpaths = ["tests"]
