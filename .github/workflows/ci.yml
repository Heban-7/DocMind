name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      # Tests run offline: tests/conftest.py ignores .env, removes provider
      # keys, and points every store at a temporary folder.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type-check and build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # V1 has 23 known lint errors; the frontend is rebuilt in milestone M9,
      # after which this step becomes blocking.
      - name: Lint (report only until M9)
        run: npm run lint
        continue-on-error: true
