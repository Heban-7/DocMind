name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: docmind
          POSTGRES_PASSWORD: docmind-ci-only
          POSTGRES_DB: docmind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docmind -d docmind_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DOCMIND_TEST_DATABASE_URL: postgresql://docmind:docmind-ci-only@localhost:5432/docmind_test
      # Database tests fail (instead of skipping) when Postgres is missing.
      DOCMIND_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      # Tests run offline: tests/conftest.py ignores .env, removes provider
      # keys, points stored files at a temporary folder and uses the
      # docmind_test database of the service above.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -q

      # Prices are copied by hand from the providers' pages: warn (never fail)
      # once they are more than 90 days old.
      - name: Model prices are recent
        run: uv run python -m src.llm.price_age --max-days 90

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type-check and build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Lint
        run: npm run lint
