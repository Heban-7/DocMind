# DocMind model registry (version 2)
# ------------------------------------------------------------------------------
# The single list of models DocMind can use, what each costs, and what it can do.
# GET /api/models serves it to the model picker; the cost ledger prices every
# call with it. Edit it here: no code change is needed to add a model.
#
# Fields
#   provider          gemini | openai | openrouter | groq
#   slug              the exact model id the provider expects
#   label             the name the picker shows
#   api               chat | reasoning   (reasoning models take
#                     max_completion_tokens + reasoning_effort, no temperature)
#   reasoning_effort  low | medium | high (reasoning models only)
#   supports_vision   can it read page images (the vision fallback needs it)
#   context_window    tokens; null where the provider page does not say
#   input_price, cached_input_price, output_price
#                     USD per 1M tokens, standard tier, as on the provider's
#                     pricing page on `prices_checked_on`; null = not published
#   free_tier         the provider offers this model free (rate-limited)
#   data_use          what the provider says it does with prompts
#   status            current | preview | deprecated
#   tested            answered a live request from DocMind on prices_checked_on
#
# Version 1 had three entries whose names did not match what they called
# (gpt-5-mini -> gpt-4o-mini, gemini-2.5-flash -> gemini-2.0-flash, ...) and
# relied on Gemini 2.0 models that Google shut down on 1 June 2026 (audit P1-7).

prices_checked_on: "2026-11-24"
sources:
  openai: https://developers.openai.com/api/docs/pricing
  gemini: https://aistudio.google.com/docs/pricing
  gemini_deprecations: https://aistudio.google.com/docs/deprecations
  groq: https://console.groq.com/docs/models

defaults:
  text: gpt-4o-mini
  vision: gpt-4o-mini
  embedding: text-embedding-3-small

# Default model per provider when only that provider's key is set.
provider_defaults:
  openai: gpt-4o-mini
  gemini: gemini-2.5-flash-lite
  groq: groq-gpt-oss-120b
  openrouter: or-gpt-4o-mini

# Old names keep working, pointed at a model that still exists.
aliases:
  gemini-flash: gemini-2.5-flash-lite
  gemini-flash-lite: gemini-2.5-flash-lite
  gemini-2.0-flash: gemini-2.5-flash-lite
  gemini-2.0-flash-lite: gemini-2.5-flash-lite
  gemini-2.5-flash: gemini-3.5-flash-lite  # Google routes 2.5 Flash there from 1 Dec 2026
  or-gemini-flash: or-gemini-2.5-flash-lite
  groq-llama-text: groq-gpt-oss-120b
  groq-llama-vision: groq-gpt-oss-120b

models:
  # --- OpenAI -----------------------------------------------------------------
  # OpenAI does not train on API data by default; there is no free API tier.
  gpt-4o-mini:
    provider: openai
    slug: gpt-4o-mini
    label: GPT-4o mini
    api: chat
    supports_vision: true
    context_window: 128000
    input_price: 0.15
    cached_input_price: 0.075
    output_price: 0.60
    free_tier: false
    data_use: Not used for training by default (OpenAI API policy).
    status: current
    tested: true

  gpt-4.1-mini:
    provider: openai
    slug: gpt-4.1-mini
    label: GPT-4.1 mini
    api: chat
    supports_vision: true
    context_window: 1047576
    input_price: 0.40
    cached_input_price: 0.10
    output_price: 1.60
    free_tier: false
    data_use: Not used for training by default (OpenAI API policy).
    status: current
    tested: true

  gpt-6-luna:
