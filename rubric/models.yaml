# Golden set v1 (25 documents, 142 questions), answer engine v2 (M7), measured
# 2026-11-24 on the test machine. See evaluation/reports/m7-*.md.
benchmarks:
  gpt-4o-mini:
    golden_set: v1
    correct_pct: 85.2
    unanswerable_refused_pct: 96.0
    first_token_p50_s: 1.1
    answer_p50_s: 2.35
    cost_per_question_usd: 0.00056
    input_tokens_mean: 3389  # a typical answer: the evidence is most of it
    output_tokens_mean: 84
    report: evaluation/reports/m7-answer-engine.md
  gpt-6-luna:
    golden_set: v1
    correct_pct: 83.8
    unanswerable_refused_pct: 96.0
    first_token_p50_s: 1.29
    answer_p50_s: 1.89
    cost_per_question_usd: 0.00038
    report: evaluation/reports/m7-gpt-6-luna.md
